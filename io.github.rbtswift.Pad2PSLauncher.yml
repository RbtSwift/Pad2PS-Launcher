app-id: io.github.rbtswift.Pad2PSLauncher
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: pad2ps-launcher
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=all
  - --filesystem=home
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: pad2ps-launcher
    buildsystem: simple
    build-commands:
      - mkdir -p /app/opt/Pad2PS-Launcher /app/bin
      - cp -a linux-unpacked/. /app/opt/Pad2PS-Launcher/
      - chmod 755 /app/opt/Pad2PS-Launcher/pad2ps-launcher
      - install -Dm755 pad2ps-launcher-flatpak.sh /app/bin/pad2ps-launcher
      - install -Dm644 icon-256.png /app/share/icons/hicolor/256x256/apps/io.github.rbtswift.Pad2PSLauncher.png
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/io.github.rbtswift.Pad2PSLauncher.png
      - install -Dm644 pad2ps-launcher.desktop /app/share/applications/pad2ps-launcher.desktop
      - install -Dm644 io.github.rbtswift.Pad2PSLauncher.metainfo.xml /app/share/metainfo/io.github.rbtswift.Pad2PSLauncher.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/RbtSwift/Pad2PS-Launcher/releases/download/v1.0.19/Pad2PS-Launcher-1.0.19-x86_64.tar.gz
        sha256: 2df034b3301504fb7283c868a6ae3860ce5a1431747fbf2fe52ccfbe63499532
        dest: linux-unpacked
        x-checker-data:
          type: github
          repo: RbtSwift/Pad2PS-Launcher
          tag-pattern: '^v([0-9.]+)$'
          asset-name: 'Pad2PS-Launcher-$version-x86_64.tar.gz'
      - type: file
        path: pad2ps-launcher-flatpak.sh
      - type: file
        path: icon-256.png
      - type: file
        path: icon.png
      - type: file
        path: pad2ps-launcher.desktop
      - type: file
        path: io.github.rbtswift.Pad2PSLauncher.metainfo.xml
