apply plugin: 'com.android.application'

def releaseKeystoreFile = file('signing.keystore')
def releaseStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: project.findProperty("ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS") ?: project.findProperty("ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD") ?: project.findProperty("ANDROID_KEY_PASSWORD")
def releaseSigningConfigured = releaseKeystoreFile.exists() && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace "io.github.rbtswift.Pad2PSLauncher"
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures { buildConfig true }
    def steamGridDbKey = (System.getenv("STEAMGRIDDB_API_KEY") ?: project.findProperty("STEAMGRIDDB_API_KEY") ?: "").toString().replace('\\', '\\\\').replace('"', '\\"')
    def igdbClientId = (System.getenv("IGDB_CLIENT_ID") ?: project.findProperty("IGDB_CLIENT_ID") ?: "").toString().replace('\\', '\\\\').replace('"', '\\"')
    def igdbClientSecret = (System.getenv("IGDB_CLIENT_SECRET") ?: project.findProperty("IGDB_CLIENT_SECRET") ?: "").toString().replace('\\', '\\\\').replace('"', '\\"')
    defaultConfig {
        applicationId "io.github.rbtswift.Pad2PSLauncher"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 21
        versionName "1.0.20"
        buildConfigField "String", "STEAMGRIDDB_API_KEY", "\"${steamGridDbKey}\""
        buildConfigField "String", "IGDB_CLIENT_ID", "\"${igdbClientId}\""
        buildConfigField "String", "IGDB_CLIENT_SECRET", "\"${igdbClientSecret}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile releaseKeystoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningConfigured) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.documentfile:documentfile:1.0.1"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
