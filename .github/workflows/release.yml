name: Release Multiplataforma (Desktop & Android)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag da release existente à qual o Flatpak será anexado"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-linux:
    if: ${{ github.event_name == 'push' }}
    name: Desktop Linux (.AppImage, .deb, .rpm, .tar.gz, .flatpak)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Instalar ferramentas de empacotamento Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder rpm
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --noninteractive --user flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - name: Instalar dependencias e compilar Vite + AppImage
        working-directory: desktop
        env:
          STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: |
          npm ci
          node -e 'require("fs").writeFileSync("steamgriddb-secret.cjs", "module.exports = " + JSON.stringify({ STEAMGRIDDB_API_KEY: process.env.STEAMGRIDDB_API_KEY || "", IGDB_CLIENT_ID: process.env.IGDB_CLIENT_ID || "", IGDB_CLIENT_SECRET: process.env.IGDB_CLIENT_SECRET || "" }) + ";")'
          npm run build
          npx electron-builder --linux AppImage dir --publish never

      - name: Empacotar .deb, .rpm e .tar.gz
        working-directory: desktop
        env:
          TAG_NAME: ${{ inputs.release_tag || github.ref_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXPECTED_VERSION="${TAG_NAME#v}"
          if [[ "$VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Tag $TAG_NAME does not match desktop/package.json version $VERSION"
            exit 1
          fi
          mkdir -p artifacts
          cp release/*.AppImage "artifacts/Pad2PS-Launcher-${VERSION}-x86_64.AppImage"
          chmod +x "artifacts/Pad2PS-Launcher-${VERSION}-x86_64.AppImage"
          tar -czf "artifacts/Pad2PS-Launcher-${VERSION}-x86_64.tar.gz" \
            -C release linux-unpacked \
            -C "$GITHUB_WORKSPACE/desktop" \
            pad2ps-launcher-bin.sh pad2ps-launcher-snap.sh \
            pad2ps-launcher.desktop icon-256.png icon.png \
            io.github.rbtswift.Pad2PSLauncher.metainfo.xml

          # .deb nativo
          mkdir -p build_deb/DEBIAN build_deb/opt/Pad2PS-Launcher build_deb/usr/bin build_deb/usr/share/applications build_deb/usr/share/icons/hicolor/256x256/apps build_deb/usr/share/icons/hicolor/512x512/apps build_deb/usr/share/metainfo build_deb/etc/apt/sources.list.d
          cp -a release/linux-unpacked/. build_deb/opt/Pad2PS-Launcher/
          install -m 755 pad2ps-launcher-bin.sh build_deb/usr/bin/pad2ps-launcher
          install -m 644 icon-256.png build_deb/usr/share/icons/hicolor/256x256/apps/pad2ps-launcher.png
          install -m 644 icon.png build_deb/usr/share/icons/hicolor/512x512/apps/pad2ps-launcher.png
          install -m 644 pad2ps-launcher.desktop build_deb/usr/share/applications/pad2ps-launcher.desktop
          install -m 644 io.github.rbtswift.Pad2PSLauncher.metainfo.xml build_deb/usr/share/metainfo/io.github.rbtswift.Pad2PSLauncher.metainfo.xml
          install -m 644 pad2ps-launcher.list build_deb/etc/apt/sources.list.d/pad2ps-launcher.list
          cat << EOF > build_deb/DEBIAN/control
          Package: pad2ps-launcher
          Version: ${VERSION}
          Section: games
          Priority: optional
          Architecture: amd64
          Maintainer: Pad2PS (Ravi Rosa) <pad2ps@eusolravi.com.br>
          Homepage: https://github.com/RbtSwift/Pad2PS-Launcher
          Description: Central de jogos estilo console com navegacao completa por controle
          EOF
          chmod 755 build_deb/DEBIAN
          chmod 644 build_deb/DEBIAN/control
          dpkg-deb --root-owner-group --build build_deb "artifacts/Pad2PS-Launcher-${VERSION}-amd64.deb"

          # .rpm nativo
          mkdir -p build_rpm/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          cat << EOF > build_rpm/SPECS/pad2ps-launcher.spec
          %global debug_package %{nil}
          %global __strip /bin/true
          %global __os_install_post %{nil}
          Name: pad2ps-launcher
          Version: ${VERSION}
          Release: 1
          Summary: Central de jogos estilo console com navegacao completa por controle
          License: MIT
          Vendor: Pad2PS
          AutoReqProv: no
          %description
          Central de jogos estilo console com navegacao completa por controle.
          %install
          mkdir -p %{buildroot}/opt/Pad2PS-Launcher %{buildroot}/usr/bin %{buildroot}/usr/share/applications %{buildroot}/usr/share/icons/hicolor/256x256/apps %{buildroot}/usr/share/icons/hicolor/512x512/apps %{buildroot}/usr/share/metainfo
          cp -a $(pwd)/release/linux-unpacked/. %{buildroot}/opt/Pad2PS-Launcher/
          install -m 755 $(pwd)/pad2ps-launcher-bin.sh %{buildroot}/usr/bin/pad2ps-launcher
          install -m 644 $(pwd)/icon-256.png %{buildroot}/usr/share/icons/hicolor/256x256/apps/pad2ps-launcher.png
          install -m 644 $(pwd)/icon.png %{buildroot}/usr/share/icons/hicolor/512x512/apps/pad2ps-launcher.png
          install -m 644 $(pwd)/pad2ps-launcher.desktop %{buildroot}/usr/share/applications/pad2ps-launcher.desktop
          install -m 644 $(pwd)/io.github.rbtswift.Pad2PSLauncher.metainfo.xml %{buildroot}/usr/share/metainfo/io.github.rbtswift.Pad2PSLauncher.metainfo.xml
          %files
          /opt/Pad2PS-Launcher
          /usr/bin/pad2ps-launcher
          /usr/share/applications/pad2ps-launcher.desktop
          /usr/share/icons/hicolor/256x256/apps/pad2ps-launcher.png
          /usr/share/icons/hicolor/512x512/apps/pad2ps-launcher.png
          /usr/share/metainfo/io.github.rbtswift.Pad2PSLauncher.metainfo.xml
          EOF
          rpmbuild --define "_topdir $(pwd)/build_rpm" -bb build_rpm/SPECS/pad2ps-launcher.spec
          cp build_rpm/RPMS/x86_64/*.rpm "artifacts/Pad2PS-Launcher-${VERSION}-x86_64.rpm"

      - name: Criar bundle Flatpak
        working-directory: desktop
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean \
            --repo=flatpak-repo flatpak-build io.github.rbtswift.Pad2PSLauncher.yml
          flatpak build-bundle flatpak-repo \
            "artifacts/Pad2PS-Launcher-$(node -p "require('./package.json').version")-x86_64.flatpak" \
            io.github.rbtswift.Pad2PSLauncher

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: desktop/artifacts/*

  build-flatpak-dispatch:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Build and attach Flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate release manifest
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          python3 - "desktop/io.github.rbtswift.Pad2PSLauncher.yml" "$RELEASE_TAG" "$VERSION" <<'PY'
          import pathlib
          import re
          import sys

          manifest, tag, version = sys.argv[1:]
          content = pathlib.Path(manifest).read_text()
          expected_url = (
              f"https://github.com/RbtSwift/Pad2PS-Launcher/releases/download/{tag}/"
              f"Pad2PS-Launcher-{version}-x86_64.tar.gz"
          )
          if expected_url not in content or not re.search(
              r"(?m)^\s+sha256:\s*[0-9a-f]{64}\s*$", content
          ):
              raise SystemExit(
                  f"Manifest is not pinned to the release tarball for {tag}"
              )
          PY

      - name: Build and upload Flatpak
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
          VERSION="${RELEASE_TAG#v}"
          mkdir -p artifacts
          flatpak-builder --user --force-clean --default-branch=stable --repo=flatpak-repo flatpak-build desktop/io.github.rbtswift.Pad2PSLauncher.yml
          flatpak build-bundle --arch=x86_64 flatpak-repo "artifacts/Pad2PS-Launcher-${VERSION}-x86_64.flatpak" io.github.rbtswift.Pad2PSLauncher stable
          gh release upload "$RELEASE_TAG" "artifacts/Pad2PS-Launcher-${VERSION}-x86_64.flatpak" --clobber

  build-windows:
    if: ${{ github.event_name == 'push' }}
    name: Desktop Windows (.exe Setup & Portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Instalar dependencias e compilar Windows
        working-directory: desktop
        env:
          STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: |
          npm ci
          node -e 'require("fs").writeFileSync("steamgriddb-secret.cjs", "module.exports = " + JSON.stringify({ STEAMGRIDDB_API_KEY: process.env.STEAMGRIDDB_API_KEY || "", IGDB_CLIENT_ID: process.env.IGDB_CLIENT_ID || "", IGDB_CLIENT_SECRET: process.env.IGDB_CLIENT_SECRET || "" }) + ";")'
          npm run build
          npx electron-builder --win nsis portable --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            desktop/release/*Setup*.exe
            desktop/release/*Portable*.exe

  build-android:
    if: ${{ github.event_name == 'push' && vars.ANDROID_SIGNING_ENABLED == 'true' }}
    name: Android (.apk & .aab)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: android/package-lock.json

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias, sincronizar Capacitor e compilar Android
        working-directory: android
        env:
          STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: |
          npm ci
          npm run build
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Preparar artefatos Android
        working-directory: android
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/*.apk "artifacts/Pad2PS-Launcher-${VERSION}-Android.apk"
          cp android/app/build/outputs/bundle/release/*.aab "artifacts/Pad2PS-Launcher-${VERSION}-Android.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: android/artifacts/*

  publish-release:
    if: ${{ github.event_name == 'push' && always() && needs.build-linux.result == 'success' && needs.build-windows.result == 'success' && (needs.build-android.result == 'success' || needs.build-android.result == 'skipped') }}
    name: Publicar GitHub Release
    needs: [build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 0

      - name: Baixar todos os artefatos
        uses: actions/download-artifact@v4
        with:
          pattern: '*-artifacts'
          path: ${{ github.workspace }}/all-artifacts
          merge-multiple: true

      - name: Gerar índices APT e publicar no Pages
        env:
          TAG_NAME: ${{ inputs.release_tag || github.ref_name }}
        run: |
          sudo apt-get update && sudo apt-get install -y dpkg-dev
          VERSION="${TAG_NAME#v}"
          CHANGELOG_PATH="$GITHUB_WORKSPACE/pages/apt/changelogs/main/p/pad2ps-launcher/pad2ps-launcher_${VERSION}.changelog"
          python3 "$GITHUB_WORKSPACE/.github/scripts/generate-apt-changelog.py" "$VERSION" "$GITHUB_WORKSPACE/RELEASE_NOTES.md" "$CHANGELOG_PATH"
          cd "$GITHUB_WORKSPACE/all-artifacts"
          dpkg-scanpackages -m . /dev/null | sed 's#Filename: ./#Filename: #' > Packages
          gzip -n -9 -c Packages > Packages.gz
          PACKAGES_SHA=$(sha256sum Packages | cut -d' ' -f1)
          PACKAGES_SIZE=$(wc -c < Packages)
          GZIP_SHA=$(sha256sum Packages.gz | cut -d' ' -f1)
          GZIP_SIZE=$(wc -c < Packages.gz)
          cat > Release <<EOF
          Origin: RbtSwift Pad2PS Launcher
          Label: RbtSwift Pad2PS Launcher
          Suite: stable
          Version: ${VERSION}
          Codename: stable
          Date: $(date -Ru)
          Architectures: amd64
          Components: main
          Description: Official Pad2PS Launcher APT repository
          Acquire-By-Hash: no
          Changelogs: https://rbtswift.github.io/Pad2PS-Launcher/apt/changelogs/@CHANGEPATH@.changelog
          SHA256:
           ${PACKAGES_SHA} ${PACKAGES_SIZE} Packages
           ${GZIP_SHA} ${GZIP_SIZE} Packages.gz
          EOF
          mkdir -p ../pages/apt
          cp Packages Packages.gz Release ../pages/apt/
          git -C ../pages config user.name "github-actions[bot]"
          git -C ../pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C ../pages add apt/Packages apt/Packages.gz apt/Release apt/changelogs
          git -C ../pages commit -m "Update APT index for v${VERSION}"
          git -C ../pages push origin gh-pages
      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: all-artifacts/*
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
